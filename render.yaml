# Render blueprint for FlowForge. Create via Render dashboard -> New -> Blueprint.
# Deploys the backend web service + the static frontend. The database is your
# existing Neon project (set DATABASE_URL below) — no Postgres is provisioned
# here. To use a Render-managed Postgres instead, add a `databases:` block and
# wire DATABASE_URL via `fromDatabase`.

services:
  - type: web
    name: flowforge-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (InviuProdCycle)
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false # optional: set to this service's own URL for the keep-alive ping

  - type: web
    name: flowforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the backend service URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
