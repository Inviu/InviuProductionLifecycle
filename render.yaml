# Render blueprint for FlowForge. Create via Render dashboard -> New -> Blueprint.
# Provisions a managed Postgres, the backend web service, and the static frontend.
databases:
  - name: flowforge-db
    plan: free
    databaseName: flowforge
    user: flowforge

services:
  - type: web
    name: flowforge-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false # set to this service's own URL to enable the keep-alive ping

  - type: web
    name: flowforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the backend service URL after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
